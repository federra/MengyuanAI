[project]
name = "shortfilm-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
    "celery[redis]>=5.5,<6",
    "pydantic-settings>=2.8,<3",
    "python-multipart>=0.0.20,<1",
    "pillow>=11,<13",
    "httpx>=0.28,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/shortfilm"]
[tool.pytest.ini_options]
testpaths = ["../../tests"]
[tool.ruff]
extend = "../../ruff.toml"
line-length = 100

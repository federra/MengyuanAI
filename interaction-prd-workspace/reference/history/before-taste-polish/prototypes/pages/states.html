<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梦源AI · 状态与恢复</title><link rel="stylesheet" href="../shared/tokens.css"></head><body><div id="app"></div><script type="module">
import {shell,mount,toast} from '../shared/components.js';
mount(shell({active:'states',content:`
<div class="page-heading"><div><p class="eyebrow">设计参考 / 02</p><h1>状态与恢复</h1><p>每个等待和异常，都应说明发生了什么、如何继续。</p></div><a class="button" href="./components.html" data-nav="components">← 返回公共组件</a></div>
<section class="panel section" id="task-demo"><div class="panel-header"><div><h2>镜头生成 · 可操作演示</h2><p class="helper">首次运行模拟部分失败；重试仅补齐失败镜头。无真实调用。</p></div><span class="pill info" id="task-state" aria-live="polite">尚未开始</span></div><div class="grid"><div><div class="row"><button class="button primary" id="run-task">开始演示</button><button class="button" id="cancel-task" disabled>取消任务</button><button class="button" id="reset-task">重置演示</button></div><div class="progress" role="progressbar" aria-label="镜头生成演示进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="task-progress"><span></span></div><p id="task-message" role="status">准备生成 3 个镜头，输入版本：分镜 v2 / 提示词 v1。</p></div><div class="review-box"><div class="row" style="justify-content:space-between"><span>镜头 01 · 雨中街道</span><span class="pill" id="clip-1">未开始</span></div><div class="row" style="justify-content:space-between;margin-top:10px"><span>镜头 02 · 递出包裹</span><span class="pill" id="clip-2">未开始</span></div><div class="row" style="justify-content:space-between;margin-top:10px"><span>镜头 03 · 久别重逢</span><span class="pill" id="clip-3">未开始</span></div><button class="button" id="retry-task" hidden style="margin-top:16px">仅重试镜头 02</button></div></div></section>
<div class="grid-three section"><section class="panel state-card" id="state-empty"><span class="pill">初始空状态</span><h3 style="margin-top:12px" id="empty-title">还没有作品</h3><p id="empty-copy">从一句话创意开始。先保存想法，模型可以稍后配置。</p><div class="actions"><button class="button primary" id="create-example">创建示例作品</button></div></section><section class="panel state-card" id="state-config"><span class="pill warning" id="config-state">配置缺失</span><h3 style="margin-top:12px">尚未选择审核模型</h3><p id="config-copy">输入内容已保留。配置合适的文本模型后，才能开始审核。</p><div class="actions"><button class="button" id="resolve-config">模拟补齐配置</button></div></section><section class="panel state-card" id="state-confirm"><span class="pill success">生成成功</span><h3 style="margin-top:12px">参考图已生成</h3><p id="confirm-copy">生成成功不等于用户选用，请检查角色与场景的一致性。</p><div class="actions"><button class="button primary" id="confirm-asset">确认选用示例</button></div></section></div>
<div class="grid section"><section class="panel" id="state-save"><div class="panel-header"><h2>编辑与保存反馈</h2><span class="pill warning" id="network-status">演示离线</span></div><label class="field">创作备注<textarea id="offline-input">镜头 02 要补充从车后取出包裹的动作。</textarea></label><div class="row" style="margin-top:12px"><button class="button primary" id="save-note">尝试保存</button><button class="button" id="reconnect">模拟恢复连接</button></div><div class="notice" id="save-feedback" role="status" style="margin-top:16px">模拟离线：可以继续编辑；保存时会给出失败原因。</div><p class="helper">该卡片仅演示反馈，不连接后端；本页刷新后恢复初始示例。</p></section><section class="panel" id="state-stale"><div class="panel-header"><h2>上游变更与旧结果</h2><span class="pill warning">需检查影响</span></div><div class="review-box"><p class="eyebrow">当前分镜 v3 / 已生成视频基于 v2</p><h3>镜头 02 的动作已调整</h3><p id="stale-copy">旧视频继续保留，但需检查是否匹配最新分镜。配置修改也不会改变已提交任务。</p></div><div class="row" style="margin-top:16px"><button class="button" id="inspect-stale">查看版本说明</button></div><div class="notice warning" id="stale-detail" hidden style="margin-top:12px">新分镜增加“取出包裹”动作。旧视频绑定 v2；更新应提交新任务，导出前需处理版本差异。</div></section></div>
<section class="panel section" id="novel-chain-states"><h2>双入口共用状态</h2><div class="grid-three"><div class="review-box"><span class="pill">小说待选定</span><p>三个方向均可打开修改；选定一篇后才提交剧本生成。</p></div><div class="review-box"><span class="pill warning">自动质检待修复</span><p>剧情或情绪有差异，修复时带入原文、当前内容及报告，完成后自动复检。</p></div><div class="review-box"><span class="pill danger">图片引用失效</span><p>@图片无法映射到有效资源，阻止生成并从选择器重新绑定。</p></div><div class="review-box"><span class="pill info">等待前镜尾帧</span><p>前镜成功后提取末帧，再提交后一镜。其余四类参考图保留。</p></div><div class="review-box"><span class="pill danger">尾帧失败 / 顺序暂停</span><p>保留已完成镜头，修复后从断点继续；前镜变化使后续依赖镜头待更新。</p></div><div class="review-box"><span class="pill warning">独立音频待更新</span><p>台词修改后旧 TTS 标为过期，可单独重生成音频。</p></div></div></section><section class="panel section" id="state-static"><div class="panel-header"><h2>状态语义对照</h2><span class="subtle">浅 / 深主题均需清晰可读</span></div><div class="grid-three"><div class="review-box"><span class="pill info">加载中</span><div class="skeleton"></div><div class="skeleton" style="width:68%"></div><p>保持结构，说明正在读取什么。</p></div><div class="review-box"><span class="pill danger">审核请求失败</span><p>没有有效报告，不能显示“审核通过”。</p><span class="helper">保留原文与当前版本，允许重试。</span></div><div class="review-box"><span class="pill warning">内容待确认</span><p>审核已结束，仍需用户确认当前版本。</p><span class="helper">确认后的修改会使原确认失效。</span></div></div></section>`}));
const $=id=>document.getElementById(id);let timers=[],online=false,mode='idle';
function later(fn,ms){timers.push(setTimeout(fn,ms))}function clearTimers(){timers.forEach(clearTimeout);timers=[]}function progress(n){$('task-progress').setAttribute('aria-valuenow',n);$('task-progress').firstElementChild.style.width=n+'%'}function clip(n,text,kind=''){$('clip-'+n).textContent=text;$('clip-'+n).className='pill '+kind}function state(text,kind='info'){$('task-state').textContent=text;$('task-state').className='pill '+kind}
function reset(){clearTimers();mode='idle';state('尚未开始');progress(0);[1,2,3].forEach(n=>clip(n,'未开始'));$('run-task').disabled=false;$('cancel-task').disabled=true;$('retry-task').hidden=true;$('task-message').textContent='准备生成 3 个镜头，输入版本：分镜 v2 / 提示词 v1。'}
$('run-task').onclick=()=>{reset();mode='running';$('run-task').disabled=true;$('cancel-task').disabled=false;state('排队中');$('task-message').textContent='演示任务已排队，使用提交时版本。';later(()=>{state('生成中');progress(33);clip(1,'成功','success');clip(2,'运行中','info');clip(3,'排队中')},600);later(()=>{mode='failed';state('部分失败','warning');progress(67);clip(2,'失败 · 超时','danger');clip(3,'成功','success');$('cancel-task').disabled=true;$('retry-task').hidden=false;$('task-message').textContent='2 个镜头成功，镜头 02 模拟超时。成功结果已保留，可单独重试。'},1700)};
$('retry-task').onclick=()=>{clearTimers();mode='retrying';state('局部重试中');clip(2,'重试中','info');$('retry-task').hidden=true;$('cancel-task').disabled=false;$('task-message').textContent='仅提交镜头 02；镜头 01、03 的成功结果保持不变。';later(()=>{mode='success';state('全部生成成功','success');clip(2,'成功','success');progress(100);$('cancel-task').disabled=true;$('task-message').textContent='3 个镜头已生成。下一步仍需预览并选用候选，生成成功不等于已导出。'},900)};
$('cancel-task').onclick=()=>{const wasRetry=mode==='retrying';clearTimers();mode='cancelling';state('取消处理中');$('cancel-task').disabled=true;$('task-message').textContent='等待演示服务确认取消；当前成果继续保留。';later(()=>{mode='cancelled';state('已取消');if($('clip-1').textContent!=='成功')clip(1,'已取消');clip(2,'已取消');if($('clip-3').textContent!=='成功')clip(3,'已取消');$('run-task').disabled=wasRetry;$('retry-task').hidden=!wasRetry;$('task-message').textContent='演示服务已确认取消。已成功镜头仍保留；可重置演示重新开始。'},600)};
$('reset-task').onclick=reset;$('create-example').onclick=()=>{$('empty-title').textContent='雨夜送达 · 示例作品';$('empty-copy').textContent='示例已建立。真实项目创建将在主线模块中交付。';$('create-example').disabled=true;$('create-example').textContent='示例已创建'};
$('resolve-config').onclick=()=>{$('config-state').textContent='示例配置已补齐';$('config-state').className='pill success';$('config-copy').textContent='已模拟选择审核模型；真实连接检测与环节绑定由配置模块交付。';$('resolve-config').disabled=true;$('resolve-config').textContent='演示已就绪'};
$('confirm-asset').onclick=()=>{$('confirm-copy').textContent='示例素材已确认选用。后续内容变更仍需检查素材影响。';$('confirm-asset').disabled=true;$('confirm-asset').textContent='已确认选用'};
$('save-note').onclick=()=>{if(!online){$('save-feedback').className='notice danger';$('save-feedback').textContent='保存失败：当前处于演示离线状态。输入未丢失，请恢复连接后重试。'}else{$('save-feedback').className='notice success';$('save-feedback').textContent='演示保存成功，输入内容保留（本卡不连接后端）。'}};
$('reconnect').onclick=()=>{online=!online;$('network-status').textContent=online?'演示在线':'演示离线';$('network-status').className='pill '+(online?'success':'warning');$('reconnect').textContent=online?'模拟断开连接':'模拟恢复连接';toast(online?'已恢复演示连接，请重新保存':'已切换至演示离线，编辑内容保留')};$('offline-input').oninput=()=>{$('save-feedback').className='notice';$('save-feedback').textContent='有未保存修改。'};$('inspect-stale').onclick=()=>{$('stale-detail').hidden=!$('stale-detail').hidden;$('inspect-stale').textContent=$('stale-detail').hidden?'查看版本说明':'收起版本说明'};
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梦源AI · 组件展示</title><link rel="stylesheet" href="../shared/tokens.css"><link rel="stylesheet" href="../shared/taste.css"><link rel="stylesheet" href="../shared/workspace.css"></head><body><div id="app"></div><script type="module">
import {shell,mount,toast,promptDialog,bindPrompt} from '../shared/components.js';
mount(shell({active:'components',content:`
<div class="page-heading"><div><p class="eyebrow">设计参考 / 01</p><h1>基础控件样例</h1><p>完整业务流程从左侧“项目”或“创作”进入；本页为独立控件样例。</p></div><a class="button" href="./states.html" data-nav="states">查看状态与恢复 →</a></div>
<div class="grid section"><section class="panel" id="creation-form"><div class="panel-header"><h2>创作输入</h2><span class="pill" id="save-status">未修改</span></div><div class="stack"><label class="field">作品名称<input id="project-name" type="text" value="雨夜送达" maxlength="80"></label><label class="field">一句话创意<textarea id="idea-input">雨夜里，一名快递员发现收件人是十年前帮助过自己的老师，决定亲手送出这份迟到的感谢。</textarea></label><div class="field-pair"><label class="field">时长选择控件（非项目字段）<select id="duration"><option>30 秒</option><option selected>60 秒</option><option>90 秒</option></select></label><label class="field">视频画幅<select id="aspect"><option>9:16 竖屏</option></select></label></div><label class="check"><input id="confirm-check" type="checkbox" checked>关键节点由我确认后再继续</label><div class="row"><button class="button primary" id="save-draft">保存演示草稿</button><button class="button" id="restore-draft">恢复初始示例</button></div><p class="helper">草稿只保存在本浏览器演示空间，可刷新检查；不写入正式项目。</p></div></section>
<section class="panel" id="review-panel"><div class="panel-header"><h2>审核与修改</h2><span class="pill warning" id="review-status">1 项待处理</span></div><div class="review-box"><span class="pill warning">动作逻辑 · 镜头 02</span><h3>递出包裹前，缺少取件动作</h3><p>剧本描述“快递员从车后取出包裹，再走向门口”。当前分镜直接递出，动作衔接不完整。</p></div><div class="diff section" style="margin-top:16px"><div><div class="diff-title">当前分镜</div><p class="diff-text" id="current-shot">快递员站在门口，将包裹递给老师。</p></div><div><div class="diff-title">修改建议</div><p class="diff-text">快递员从车后取出包裹，走到门口，双手递给老师。</p></div></div><div class="row"><button class="button primary" id="accept-change">采纳此修改</button><button class="button" id="recheck" disabled>修改后复检</button></div><div class="notice" style="margin-top:16px" id="change-notice" role="status">采纳后形成演示新版本，需重新检查；不会自动更新已有素材。</div><div class="row" style="margin-top:16px"><button class="button" id="open-prompt">提示词设置</button><span class="pill" id="prompt-source">继承默认</span></div></section></div>
<section class="panel section" id="shot-table"><div class="panel-header"><div><h2>表格控件示例</h2><p class="helper">长描述顶对齐，按 15px 正文阅读。</p></div><span class="pill" id="version-label">分镜 v1</span></div><div class="table-scroll"><table><thead><tr><th style="width:10%">镜头</th><th style="width:43%">画面与动作</th><th style="width:18%">时长 / 情绪</th><th style="width:29%">状态与操作</th></tr></thead><tbody><tr><td>01</td><td><span class="shot-title">雨中的街道</span><span class="scene">快递员停车，望向门牌。雨水滑过头盔边缘。</span></td><td>8 秒<br>迟疑、辨认</td><td><span class="pill success">参考图已确认</span></td></tr><tr><td>02</td><td id="table-shot">快递员站在门口，将包裹递给老师。</td><td>10 秒<br>克制、感激</td><td><span class="pill warning" id="shot-state">审核待处理</span><br><button class="button link" id="locate-review" style="margin-top:8px">定位审核意见</button></td></tr></tbody></table></div></section>
<div class="grid section"><section class="panel" id="asset-panel"><div class="panel-header"><h2>素材与空状态</h2><span class="pill">场景参考图</span></div><div class="asset-tile" id="asset-empty"><div><strong>还没有参考图</strong>先确认风格，再开始生成</div></div><div class="asset-preview" id="asset-example" hidden><div><strong>雨夜门廊</strong><small>示例色卡 · 非 AI 生成图片</small></div></div><div class="row" style="margin-top:12px"><button class="button" id="load-example">载入示例色卡</button><button class="button danger" id="clear-example" disabled>清除示例</button></div><p class="helper">切换主题时，素材色卡的原始颜色保持不变。</p></section><section class="panel" id="action-panel"><div class="panel-header"><h2>操作与反馈</h2></div><div class="row"><button class="button primary" id="demo-success">主要操作</button><button class="button" id="demo-secondary">次要操作</button><button class="button" disabled>等待参考图确认</button></div><div class="notice success" style="margin-top:16px">已保存：只说明保存结果，不代表审核通过。</div><div class="notice warning" style="margin-top:12px">素材待更新：上游分镜发生变更，需要检查影响。</div><details><summary class="summary">查看长文可读性说明</summary><p>剧本、提示词和审核意见使用 15px 正文。辅助说明 13–14px；正文行高 24px，编辑区行高 26px。请使用浏览器放大检查，长内容可滚动或展开，关键动作始终保留。</p></details></section></div>${promptDialog()}`}));
bindPrompt();
const $=id=>document.getElementById(id);const initial={name:$('project-name').value,idea:$('idea-input').value,duration:'60 秒',checked:true};
try{const saved=JSON.parse(localStorage.getItem('mengyuan-demo-draft')||'null');if(saved){$('project-name').value=saved.name;$('idea-input').value=saved.idea;$('duration').value=saved.duration;$('confirm-check').checked=saved.checked;$('save-status').textContent='演示草稿已恢复'}}catch{}
$('creation-form').addEventListener('input',()=>{$('save-status').textContent='未保存修改'});
$('save-draft').onclick=()=>{if(!$('project-name').value.trim()||!$('idea-input').value.trim()){toast('请填写作品名称和一句话创意');return}try{localStorage.setItem('mengyuan-demo-draft',JSON.stringify({name:$('project-name').value,idea:$('idea-input').value,duration:$('duration').value,checked:$('confirm-check').checked}));$('save-status').textContent='演示草稿已保存';toast('演示草稿已保存，可刷新检查')}catch{toast('浏览器存储不可用，内容仍保留在输入框中')}};
$('restore-draft').onclick=()=>{$('project-name').value=initial.name;$('idea-input').value=initial.idea;$('duration').value=initial.duration;$('confirm-check').checked=true;try{localStorage.removeItem('mengyuan-demo-draft')}catch{}$('save-status').textContent='已恢复初始示例';toast('已恢复初始示例，仅清除演示草稿')};
$('accept-change').onclick=()=>{const value='快递员从车后取出包裹，走到门口，双手递给老师。';$('current-shot').textContent=value;$('table-shot').textContent=value;$('version-label').textContent='分镜 v2 · 演示';$('review-status').textContent='待复检';$('shot-state').textContent='参考图待更新';$('change-notice').textContent='已采纳至演示 v2。旧审核已失效，镜头 02 的参考图与视频需检查更新。';$('accept-change').disabled=true;$('recheck').disabled=false};
$('recheck').onclick=()=>{$('recheck').disabled=true;$('recheck').textContent='复检中…';setTimeout(()=>{$('recheck').textContent='演示复检完成';$('review-status').textContent='审核通过 · 待人工确认';$('review-status').className='pill success';$('change-notice').textContent='演示审核已通过，仍需人工确认；既有素材保持待更新。'},700)};
$('locate-review').onclick=()=>{$('review-panel').scrollIntoView({behavior:'smooth',block:'center'});$('accept-change').disabled?$('recheck').focus():$('accept-change').focus()};
$('load-example').onclick=()=>{$('asset-empty').hidden=true;$('asset-example').hidden=false;$('clear-example').disabled=false;toast('已载入示例色卡；不会调用图像模型')};$('clear-example').onclick=()=>{$('asset-empty').hidden=false;$('asset-example').hidden=true;$('clear-example').disabled=true};$('demo-success').onclick=()=>toast('主要操作反馈示例：已完成');$('demo-secondary').onclick=()=>toast('次要操作反馈示例：当前内容保留');
</script></body></html>
